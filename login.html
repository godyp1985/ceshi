<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>登录 · BrushForge 管理后台</title>
<style>
  :root {
    --bg: #0a0a0f;
    --fg: #f5f5f7;
    --fg-dim: #a1a1a6;
    --fg-muted: #6e6e73;
    --accent: #007aff;
    --accent-2: #5e5ce6;
    --accent-3: #bf5af2;
    --border: rgba(255,255,255,0.1);
    --glass: rgba(255,255,255,0.06);
    --glass-strong: rgba(255,255,255,0.1);
    --radius: 24px;
    --input-bg: rgba(255,255,255,0.05);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--fg);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    position: relative;
  }

  a { color: inherit; text-decoration: none; }

  /* animated background */
  .bg {
    position: fixed;
    inset: 0;
    z-index: -1;
    overflow: hidden;
  }
  .bg::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse at 20% 20%, rgba(0,122,255,0.15), transparent 50%),
      radial-gradient(ellipse at 80% 80%, rgba(191,90,242,0.15), transparent 50%),
      radial-gradient(ellipse at 50% 50%, rgba(94,92,230,0.1), transparent 60%);
  }
  .orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(120px);
    opacity: 0.4;
    animation: drift 18s ease-in-out infinite;
  }
  .orb.o1 {
    width: 500px; height: 500px;
    background: radial-gradient(circle, var(--accent), transparent 70%);
    top: -100px; left: -100px;
  }
  .orb.o2 {
    width: 600px; height: 600px;
    background: radial-gradient(circle, var(--accent-3), transparent 70%);
    bottom: -150px; right: -150px;
    animation-delay: -6s;
  }
  .orb.o3 {
    width: 400px; height: 400px;
    background: radial-gradient(circle, var(--accent-2), transparent 70%);
    top: 40%; left: 50%;
    animation-delay: -12s;
  }
  @keyframes drift {
    0%,100% { transform: translate(0,0) scale(1); }
    25% { transform: translate(60px,-40px) scale(1.1); }
    50% { transform: translate(-30px,30px) scale(0.95); }
    75% { transform: translate(40px,20px) scale(1.05); }
  }

  /* grid overlay */
  .grid {
    position: fixed;
    inset: 0;
    z-index: -1;
    background-image:
      linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size: 48px 48px;
    mask-image: radial-gradient(ellipse at center, black 30%, transparent 70%);
    -webkit-mask-image: radial-gradient(ellipse at center, black 30%, transparent 70%);
  }

  .card {
    width: 100%;
    max-width: 440px;
    margin: 24px;
    padding: 44px 40px;
    border-radius: var(--radius);
    background: rgba(17,17,24,0.6);
    backdrop-filter: blur(40px) saturate(180%);
    -webkit-backdrop-filter: blur(40px) saturate(180%);
    border: 1px solid var(--border);
    box-shadow: 0 40px 100px -20px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.02) inset;
    animation: cardIn .7s cubic-bezier(.4,0,.2,1);
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(20px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .logo {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 8px;
  }
  .logo-mark {
    width: 36px; height: 36px;
    border-radius: 10px;
    background: conic-gradient(from 180deg, var(--accent), var(--accent-2), var(--accent-3), var(--accent));
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 6px 20px rgba(94,92,230,0.45);
  }
  .logo-mark svg { width: 20px; height: 20px; }
  .logo-text {
    font-size: 20px;
    font-weight: 600;
    letter-spacing: -0.02em;
  }

  .title {
    text-align: center;
    margin-top: 28px;
  }
  .title h1 {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.025em;
    margin-bottom: 8px;
  }
  .title p {
    font-size: 15px;
    color: var(--fg-dim);
  }

  .tabs {
    display: flex;
    gap: 4px;
    padding: 4px;
    background: var(--input-bg);
    border-radius: 12px;
    margin: 28px 0 24px;
    border: 1px solid var(--border);
  }
  .tab {
    flex: 1;
    padding: 10px;
    text-align: center;
    font-size: 14px;
    font-weight: 500;
    border-radius: 8px;
    cursor: pointer;
    color: var(--fg-dim);
    transition: all .25s;
    border: none;
    background: transparent;
  }
  .tab.active {
    background: rgba(255,255,255,0.12);
    color: var(--fg);
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
  }

  .field {
    margin-bottom: 18px;
  }
  .field label {
    display: block;
    font-size: 13px;
    font-weight: 500;
    color: var(--fg-dim);
    margin-bottom: 8px;
  }
  .input-wrap {
    position: relative;
  }
  .input-wrap svg {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    width: 18px; height: 18px;
    stroke: var(--fg-muted);
    pointer-events: none;
  }
  .field input {
    width: 100%;
    padding: 14px 14px 14px 44px;
    background: var(--input-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--fg);
    font-size: 15px;
    font-family: inherit;
    transition: all .2s;
    outline: none;
  }
  .field input::placeholder { color: var(--fg-muted); }
  .field input:focus {
    border-color: var(--accent);
    background: rgba(0,122,255,0.05);
    box-shadow: 0 0 0 4px rgba(0,122,255,0.12);
  }
  .field input:focus + svg,
  .input-wrap:focus-within svg { stroke: var(--accent); }

  .toggle-eye {
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    cursor: pointer;
    padding: 4px;
    color: var(--fg-muted);
  }
  .toggle-eye:hover { color: var(--fg-dim); }

  .row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
    font-size: 13px;
  }
  .remember {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--fg-dim);
    cursor: pointer;
  }
  .remember input {
    width: 16px; height: 16px;
    accent-color: var(--accent);
    cursor: pointer;
  }
  .forgot {
    color: var(--accent);
    transition: opacity .2s;
  }
  .forgot:hover { opacity: 0.8; }

  .btn-submit {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 600;
    font-family: inherit;
    color: #fff;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    cursor: pointer;
    transition: all .25s;
    box-shadow: 0 8px 24px rgba(0,122,255,0.3);
  }
  .btn-submit:hover {
    transform: translateY(-1px);
    box-shadow: 0 12px 32px rgba(0,122,255,0.4);
  }
  .btn-submit:active { transform: translateY(0); }
  .btn-submit.loading {
    pointer-events: none;
    opacity: 0.8;
  }
  .btn-submit .spinner {
    display: none;
    width: 18px; height: 18px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin .7s linear infinite;
    margin: 0 auto;
  }
  .btn-submit.loading .spinner { display: block; }
  .btn-submit.loading .label { display: none; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 24px 0;
    color: var(--fg-muted);
    font-size: 13px;
  }
  .divider::before, .divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .social {
    display: flex;
    gap: 12px;
  }
  .social button {
    flex: 1;
    padding: 12px;
    background: var(--input-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    color: var(--fg);
    font-size: 14px;
    font-family: inherit;
    transition: all .2s;
  }
  .social button:hover {
    background: var(--glass-strong);
    border-color: rgba(255,255,255,0.2);
  }
  .social svg { width: 18px; height: 18px; }

  .signup {
    text-align: center;
    margin-top: 24px;
    font-size: 14px;
    color: var(--fg-dim);
  }
  .signup a {
    color: var(--accent);
    font-weight: 500;
  }
  .signup a:hover { text-decoration: underline; }

  .back {
    position: fixed;
    top: 20px; left: 20px;
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--fg-dim);
    font-size: 14px;
    padding: 8px 14px;
    border-radius: 980px;
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(10px);
    border: 1px solid var(--border);
    transition: all .2s;
  }
  .back:hover {
    color: var(--fg);
    background: rgba(255,255,255,0.1);
  }
  .back svg { width: 16px; height: 16px; }

  .error {
    display: none;
    padding: 10px 14px;
    background: rgba(255,45,85,0.1);
    border: 1px solid rgba(255,45,85,0.3);
    color: #ff7a90;
    border-radius: 10px;
    font-size: 13px;
    margin-bottom: 16px;
  }
  .error.show { display: block; animation: shake .4s; }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }

  @media (max-width: 480px) {
    .card { padding: 32px 24px; }
  }
</style>
</head>
<body>

<div class="bg">
  <div class="orb o1"></div>
  <div class="orb o2"></div>
  <div class="orb o3"></div>
</div>
<div class="grid"></div>

<a href="index.html" class="back">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
  返回首页
</a>

<div class="card">
  <div class="logo">
    <span class="logo-mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"><path d="M4 20c4-1 12-9 14-14a1 1 0 0 0-1-1c-5 2-13 10-14 14a1 1 0 0 0 1 1z"/><circle cx="18" cy="6" r="1.5"/></svg>
    </span>
    <span class="logo-text">BrushForge</span>
  </div>

  <div class="title">
    <h1>管理后台</h1>
    <p>登录以访问笔刷管理控制台</p>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="login">账号登录</button>
    <button class="tab" data-tab="sso">SSO</button>
  </div>

  <div class="error" id="error">请输入有效的邮箱和密码</div>

  <form id="loginForm">
    <div class="field">
      <label for="email">邮箱</label>
      <div class="input-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
        <input type="email" id="email" placeholder="admin@brushforge.io" autocomplete="email" value="admin@brushforge.io" />
      </div>
    </div>

    <div class="field">
      <label for="password">密码</label>
      <div class="input-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" />
        <button type="button" class="toggle-eye" id="toggleEye" aria-label="显示密码">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </div>

    <div class="row">
      <label class="remember">
        <input type="checkbox" checked /> 记住我
      </label>
      <a href="#" class="forgot">忘记密码？</a>
    </div>

    <button type="submit" class="btn-submit" id="submitBtn">
      <span class="label">登 录</span>
      <span class="spinner"></span>
    </button>
  </form>

  <div class="divider">或</div>

  <div class="social">
    <button type="button">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 .5C5.6.5.5 5.6.5 12c0 5.1 3.3 9.4 7.9 10.9.6.1.8-.2.8-.6v-2c-3.2.7-3.9-1.5-3.9-1.5-.5-1.3-1.3-1.7-1.3-1.7-1.1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1 1.8 2.8 1.3 3.5 1 .1-.8.4-1.3.8-1.6-2.6-.3-5.3-1.3-5.3-5.7 0-1.3.5-2.3 1.2-3.1-.1-.3-.5-1.5.1-3.1 0 0 1-.3 3.3 1.2a11.5 11.5 0 0 1 6 0C17 4.6 18 4.9 18 4.9c.6 1.6.2 2.8.1 3.1.7.8 1.2 1.8 1.2 3.1 0 4.4-2.7 5.4-5.3 5.7.4.4.8 1.1.8 2.2v3.3c0 .3.2.7.8.6 4.6-1.5 7.9-5.8 7.9-10.9C23.5 5.6 18.4.5 12 .5z"/></svg>
      GitHub
    </button>
    <button type="button">
      <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      Google
    </button>
  </div>

  <div class="signup">
    还没有账号？<a href="#">联系管理员</a>
  </div>
</div>

<script>
  // tabs
  const tabs = document.querySelectorAll('.tab');
  tabs.forEach(t => t.addEventListener('click', () => {
    tabs.forEach(x => x.classList.remove('active'));
    t.classList.add('active');
  }));

  // toggle password
  const pwd = document.getElementById('password');
  const eye = document.getElementById('toggleEye');
  eye.addEventListener('click', () => {
    const show = pwd.type === 'password';
    pwd.type = show ? 'text' : 'password';
    eye.innerHTML = show
      ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>'
      : '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
  });

  // submit
  const form = document.getElementById('loginForm');
  const err = document.getElementById('error');
  const btn = document.getElementById('submitBtn');
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    err.classList.remove('show');
    const email = document.getElementById('email').value.trim();
    const password = pwd.value;
    if (!email || !/^\S+@\S+\.\S+$/.test(email) || !password) {
      err.classList.add('show');
      return;
    }
    btn.classList.add('loading');
    setTimeout(() => {
      btn.classList.remove('loading');
      window.location.href = 'dashboard.html';
    }, 1100);
  });
</script>
</body>
</html>
